<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script type="text/javascript">
        let marks=80
        if (marks>80) 
        {console.log("A")}
        else if(70<marks<80)
        {console.log("B")}
        else if(60<marks<70)
        {console.log("C")}
        else if(marks<35)
        {console.log("F")}

        let grade="A"
        switch(grade){
            case "A":
                console.log("Marks are 80+")
                break;
            case "B":
                console.log("Marks are 70+")
                break;
            case "C":
                console.log("Marks are 60+")
                break;
            case "D":
                console.log("Marks are35-")
                break;
        }
    </script>
</body>
</html>
